<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Watching Database - All Birds</title>
    <link rel="stylesheet" href="/css/forest-theme.css">
</head>
<body>
  <!-- TODO CLEAR ALL CSS -->
  <div class="gutters">
    <header class="header">
      <h1>Bird Watching Database</h1>
      <p>Discover, track, and manage your bird sightings. Whether you're a seasoned ornithologist or just starting your bird watching journey, this application helps you keep detailed records of your avian encounters.</p>
    </header>
    
    <main class="birds-grid">
      <div th:each="bird: ${birds}" class="bird-card">
        <div class="bird-card__header">
          <div>
            <h2 th:text="${bird.name}"></h2> 
            <p class="bird-card__binomial" th:text="${bird.binomialName}"></p>
          </div>
          <a th:href="@{/bird/{id}(id=${bird.id})}" class="bird-link">View Details →</a>
        </div>
        <p th:text="${bird.description}"></p>
      </div>
    </main>
  </div>
</body>
</html>
