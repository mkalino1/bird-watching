<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Watching Database</title>
    <link rel="stylesheet" href="/css/forest-theme.css">
</head>
<body>
  <div class="gutters">
    <header class="header">
      <h1>Bird Watching Database</h1>
      <p>Discover, track, and manage your bird sightings. Whether you're a seasoned ornithologist or just starting your bird watching journey, this application helps you keep detailed records of your avian encounters.</p>
    </header>
    
    <main>
      <div class="bird-card">
        <div th:if="${bird != null}" class="bird-card__header">
          <h2 th:text="${bird.name}"></h2> 
          <p class="bird-card__binomial" th:text="${bird.binomialName}"></p>
        </div>
        <p th:text="${bird.description}"></p>
      </div>
      <div th:if="${bird == null}" class="not-found">
        <p>Bird not found</p>
        <a href="/" class="back-link">← Back to All Birds</a>
      </div>
      
      <div th:if="${bird != null}" style="text-align: center;">
        <a href="/" class="back-link">← Back to All Birds</a>
      </div>
    </main>
  </div>
</body>
</html>
